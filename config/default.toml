# nofind — Default Configuration
# Generated by `nofind config init`

[network]
socks5_proxy = "127.0.0.1:9050"
tor_control_port = 9051
tor_control_password = ""
connect_timeout_secs = 15
request_timeout_secs = 30

[dns]
doh_provider = "cloudflare"          # cloudflare | google | quad9
dns_leak_protection = true
dns_cache_enabled = true

[privacy]
rotate_identity_interval_secs = 60   # Auto-rotate Tor identity
kill_switch = false
session_isolation = true
cookie_isolation = true
user_agent_rotation = true
stream_isolation = true              # Unique SOCKS5 creds per session
fingerprint_level = "basic"          # off | basic | full
browser_profile = "random"           # firefox | chrome | safari | random
jitter_enabled = true
jitter_base_delay_ms = 30            # Base delay before requests
jitter_range_ms = 120                # ± random jitter
padding_strategy = "random"          # none | block | random
tor_bridges = []                     # obfs4 bridge lines

[security]
clean_cache_on_exit = true
clean_history_on_exit = true
ephemeral_sessions = true

profile = "standard"

# ── Privacy Profiles ─────────────────────────────────────────────

[profiles.standard]
user_agent_rotation = true
dns_over_https = true
tor_enabled = true
kill_switch = false
rotate_identity_interval_secs = 0
stream_isolation = true
jitter_enabled = true
fingerprint_level = "basic"
browser_profile = "firefox"

[profiles.paranoid]
user_agent_rotation = true
dns_over_https = true
tor_enabled = true
kill_switch = true
rotate_identity_interval_secs = 120
stream_isolation = true
jitter_enabled = true
fingerprint_level = "full"
browser_profile = "random"
